<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIえほんメーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FFFBF5]">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [step, setStep] = React.useState("setup");
            const [apiKey, setApiKey] = React.useState("");
            const [mainChar, setMainChar] = React.useState("こうあちゃん");
            const [story, setStory] = React.useState([]);
            const [pageIndex, setPageIndex] = React.useState(0);
            const [loading, setLoading] = React.useState(false);

            const generateStory = async () => {
                if (!apiKey) return alert("APIキーを入力してください");
                setLoading(true);
                try {
                   // 「v1beta」から、より安定した「v1」に変更します
                    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                    
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${mainChar}が主人公の、2歳児向けのとっても優しい絵本を4ページ分作ってください。各ページ1〜2文のひらがなだけで。出力は以下のJSON形式のみで返して： {"pages": [{"text": "本文"}]}` }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!res.ok) {
                        const errBody = await res.json();
                        throw new Error(errBody.error?.message || "通信エラー");
                    }

                    const data = await res.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    setStory(result.pages);
                    setStep("reader");
                } catch (e) {
                    console.error(e);
                    alert("エラーの内容: " + e.message + "\n\n※APIキーが正しいか、Google AI Studioで有効になっているか確認してください。");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6 font-sans">
                    <header className="flex items-center gap-3 mb-8">
                        <div className="bg-rose-500 p-2 rounded-lg text-white font-bold text-xl">📖</div>
                        <h1 className="text-xl font-bold text-slate-800">AIえほんメーカー</h1>
                    </header>

                    {step === "setup" ? (
                        <div className="bg-white p-6 rounded-3xl shadow-xl border border-rose-100">
                            <label className="block text-sm font-bold text-slate-400 mb-2">Gemini APIキー</label>
                            <input 
                                type="password" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)}
                                className="w-full p-3 bg-amber-50 rounded-xl mb-6 border border-amber-200 outline-none"
                                placeholder="Google AI Studioで取得したキー"
                            />
                            <label className="block text-sm font-bold text-slate-400 mb-2">しゅじんこう</label>
                            <input 
                                value={mainChar} 
                                onChange={(e) => setMainChar(e.target.value)}
                                className="w-full p-3 bg-rose-50 rounded-xl mb-8 font-bold outline-none"
                            />
                            <button 
                                onClick={generateStory}
                                disabled={loading}
                                className="w-full bg-rose-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-rose-600 active:scale-95 transition-all"
                            >
                                {loading ? "かんがえちゅう..." : "✨ えほんをつくる！"}
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <div className="bg-white p-8 rounded-3xl shadow-xl min-h-[250px] flex items-center justify-center text-center border-4 border-white ring-1 ring-rose-100">
                                <p className="text-2xl font-black leading-relaxed text-slate-800">{story[pageIndex].text}</p>
                            </div>
                            <div className="flex justify-between items-center px-2">
                                <button onClick={() => setPageIndex(Math.max(0, pageIndex - 1))} className="p-4 bg-white rounded-2xl shadow">⬅️</button>
                                <span className="font-bold text-slate-400">{pageIndex + 1} / {story.length}</span>
                                <button onClick={() => setPageIndex(Math.min(story.length - 1, pageIndex + 1))} className="p-4 bg-rose-500 text-white rounded-2xl shadow">➡️</button>
                            </div>
                            <button onClick={() => setStep("setup")} className="w-full text-slate-400 text-sm font-bold mt-10">設定にもどる</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
