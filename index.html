<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIえほんメーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FFFBF5]">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [step, setStep] = React.useState("setup");
            const [apiKey, setApiKey] = React.useState("");
            const [mainChar, setMainChar] = React.useState("こうあちゃん");
            const [story, setStory] = React.useState([]);
            const [pageIndex, setPageIndex] = React.useState(0);
            const [loading, setLoading] = React.useState(false);

            const generateStory = async () => {
                if (!apiKey) return alert("APIキーを入力してください");
                setLoading(true);
                
                // 2026年現在、最も汎用的な v1 エンドポイントを使用
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${mainChar}が主人公の、2歳児向けの優しい絵本を4ページ分作ってください。各ページ1〜2文のひらがなだけで。必ずこのJSON形式で返して： {"pages": [{"text": "本文"}]}` }] }]
                        })
                    });

                    if (!res.ok) {
                        const errorData = await res.json();
                        throw new Error(errorData.error?.message || "通信エラー");
                    }

                    const data = await res.json();
                    // AIの回答からJSON部分を抽出する処理
                    let textResponse = data.candidates[0].content.parts[0].text;
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error("AIの返答が正しくありませんでした");
                    
                    const result = JSON.parse(jsonMatch[0]);
                    setStory(result.pages);
                    setStep("reader");
                    setPageIndex(0);
                } catch (e) {
                    console.error(e);
                    alert("エラー: " + e.message + "\n\n【確認】APIキーの前後にお城の石垣のような「余計なスペース」が入っていませんか？");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6 font-sans">
                    <header className="flex items-center gap-3 mb-8">
                        <div className="bg-rose-500 p-2 rounded-lg text-white font-bold text-xl">📖</div>
                        <h1 className="text-xl font-bold text-slate-800 tracking-tight">AIえほんメーカー</h1>
                    </header>

                    {step === "setup" ? (
                        <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-rose-100 animate-in zoom-in-95 duration-500">
                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">Gemini API Key</label>
                            <input 
                                type="password" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value.trim())}
                                className="w-full p-4 bg-amber-50 rounded-2xl mb-6 border-2 border-transparent focus:border-amber-200 outline-none transition-all"
                                placeholder="AI Studioのキーをペースト"
                            />
                            <label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">しゅじんこう</label>
                            <input 
                                value={mainChar} 
                                onChange={(e) => setMainChar(e.target.value)}
                                className="w-full p-4 bg-rose-50 rounded-2xl mb-10 font-bold border-2 border-transparent focus:border-rose-200 outline-none transition-all"
                            />
                            <button 
                                onClick={generateStory}
                                disabled={loading}
                                className="w-full bg-rose-500 text-white font-black py-5 rounded-3xl shadow-xl shadow-rose-200 hover:bg-rose-600 active:scale-95 transition-all text-lg"
                            >
                                {loading ? "かんがえちゅう..." : "✨ えほんをつくる！"}
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-6 animate-in fade-in duration-700">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl min-h-[300px] flex items-center justify-center text-center border-8 border-white ring-1 ring-rose-100">
                                <p className="text-2xl font-black leading-relaxed text-slate-800">{story[pageIndex].text}</p>
                            </div>
                            <div className="flex justify-between items-center px-4">
                                <button onClick={() => setPageIndex(Math.max(0, pageIndex - 1))} className="w-16 h-16 bg-white rounded-2xl shadow-lg hover:bg-slate-50 transition-colors flex items-center justify-center text-2xl">⬅️</button>
                                <span className="font-bold text-slate-400 bg-white px-6 py-2 rounded-full shadow-inner">{pageIndex + 1} / {story.length}</span>
                                <button onClick={() => setPageIndex(Math.min(story.length - 1, pageIndex + 1))} className="w-16 h-16 bg-rose-500 text-white rounded-2xl shadow-lg hover:bg-rose-600 transition-colors flex items-center justify-center text-2xl">➡️</button>
                            </div>
                            <button onClick={() => setStep("setup")} className="w-full text-slate-300 text-xs font-black mt-12 hover:text-rose-400 transition-colors tracking-widest">SETTING BACK</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
