<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIえほんメーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FFFBF5]">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [step, setStep] = React.useState("setup");
            const [apiKey, setApiKey] = React.useState("");
            const [mainChar, setMainChar] = React.useState("こうあちゃん");
            const [story, setStory] = React.useState([]);
            const [pageIndex, setPageIndex] = React.useState(0);
            const [loading, setLoading] = React.useState(false);

            const generateStory = async () => {
                if (!apiKey) return alert("APIキーを 入力してください");
                setLoading(true);
                
                // 【404対策】最新の gemini-2.0-flash を使用。これが一番通りやすいです。
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${mainChar}が主人公の、2歳児向けのひらがな絵本を4ページ分作って。JSON形式 {"pages": [{"text": "本文"}]} で答えて。` }] }]
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || "通信エラー");

                    const text = data.candidates[0].content.parts[0].text;
                    const result = JSON.parse(text.match(/\{[\s\S]*\}/)[0]);
                    setStory(result.pages);
                    setStep("reader");
                    setPageIndex(0);
                } catch (e) {
                    alert("エラー: " + e.message + "\n\n※キーが正しいか確認してください");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6 font-sans text-slate-800 text-center">
                    <header className="mb-8">
                        <h1 className="text-2xl font-black text-rose-500">📖 AIえほんメーカー</h1>
                    </header>

                    {step === "setup" ? (
                        <div className="bg-white p-8 rounded-[2rem] shadow-xl border border-rose-100">
                            <p className="text-xs font-bold text-slate-400 mb-2">APIキー</p>
                            <input 
                                type="password" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value.trim())}
                                className="w-full p-4 bg-amber-50 rounded-2xl mb-6 border-2 border-transparent focus:border-amber-200 outline-none"
                                placeholder="ここへ 貼り付け"
                            />
                            <p className="text-xs font-bold text-slate-400 mb-2">しゅじんこう</p>
                            <input 
                                value={mainChar} 
                                onChange={(e) => setMainChar(e.target.value)}
                                className="w-full p-4 bg-rose-50 rounded-2xl mb-10 font-bold border-2 border-transparent focus:border-rose-200 outline-none text-lg"
                            />
                            <button 
                                onClick={generateStory}
                                disabled={loading}
                                className="w-full bg-rose-500 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-rose-600 transition-all text-xl"
                            >
                                {loading ? "かんがえちゅう..." : "✨ えほんをつくる！"}
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl min-h-[300px] flex items-center justify-center border-8 border-white">
                                <p className="text-2xl font-black leading-relaxed">{story[pageIndex].text}</p>
                            </div>
                            <div className="flex justify-between items-center gap-4">
                                <button onClick={() => setPageIndex(Math.max(0, pageIndex - 1))} className="w-16 h-16 bg-white rounded-2xl shadow-lg text-2xl border border-slate-100">⬅️</button>
                                <span className="font-bold text-slate-400">{pageIndex + 1} / {story.length}</span>
                                <button onClick={() => setPageIndex(Math.min(story.length - 1, pageIndex + 1))} className="w-16 h-16 bg-rose-500 text-white rounded-2xl shadow-lg text-2xl">➡️</button>
                            </div>
                            <button onClick={() => setStep("setup")} className="w-full text-slate-300 text-xs mt-10">もどる</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
