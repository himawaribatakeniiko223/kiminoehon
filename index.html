<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIえほんメーカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FFFBF5] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [step, setStep] = useState("setup");
      const [apiKey, setApiKey] = useState("");
      const [mainChar, setMainChar] = useState("こうあちゃん");
      const [pageCount, setPageCount] = useState(4);
      const [story, setStory] = useState([]);
      const [pageIndex, setPageIndex] = useState(0);
      const [loading, setLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState("");
      const [debugInfo, setDebugInfo] = useState("");

      // まずは 1つだけで試す
      // ここは /v1/models?key=... で確認できた名前に変えてください
      const MODEL_NAME = "gemini-1.5-flash";

      function splitStoryToPages(text, count) {
        if (!text) return null;

        // JSONっぽければ拾う
        const fenced = text.match(/```json\s*([\s\S]*?)\s*```/i) || text.match(/```\s*([\s\S]*?)\s*```/i);
        const raw = fenced ? fenced[1] : text;

        try {
          const firstBrace = raw.indexOf("{");
          const lastBrace = raw.lastIndexOf("}");
          if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
            const obj = JSON.parse(raw.slice(firstBrace, lastBrace + 1));
            if (Array.isArray(obj.pages)) {
              return obj.pages
                .map(p => typeof p === "string" ? { text: p } : { text: p.text || "" })
                .filter(p => p.text.trim())
                .slice(0, count);
            }
          }
        } catch (_) {}

        // JSONでなくても段落で分割
        const chunks = raw
          .split(/\n{2,}/)
          .map(s => s.trim())
          .filter(Boolean);

        if (chunks.length > 0) {
          return chunks.slice(0, count).map(s => ({ text: s }));
        }

        return null;
      }

      async function checkModels(key) {
        const url = `https://generativelanguage.googleapis.com/v1/models?key=${encodeURIComponent(key)}`;
        const res = await fetch(url);
        const data = await res.json().catch(() => null);

        if (!res.ok) {
          throw new Error(data?.error?.message || `モデル一覧取得失敗: HTTP ${res.status}`);
        }

        const names = (data.models || []).map(m => m.name || "");
        return names;
      }

      async function generateStory() {
        const key = apiKey.trim();
        const hero = mainChar.trim() || "こうあちゃん";

        if (!key) {
          alert("APIキーを入力してください");
          return;
        }

        setLoading(true);
        setErrorMessage("");
        setDebugInfo("");

        try {
          // 先に利用可能モデルを確認
          const modelNames = await checkModels(key);
          const fullModelName = `models/${MODEL_NAME}`;

          if (!modelNames.includes(fullModelName)) {
            throw new Error(
              `このAPIキーでは ${fullModelName} が見つかりません。\n` +
              `利用可能モデル例:\n${modelNames.slice(0, 20).join("\n")}`
            );
          }

          const prompt = `
あなたは子ども向け絵本の作家です。
${hero}が主人公の、2歳児向けのやさしいひらがな絵本を ${pageCount}ページ作ってください。

条件:
- できるだけ ひらがな を使う
- 1ページ 1〜2文
- こわくしない
- やさしい終わり方にする
- 主人公は毎ページに出す
- 返答はページごとに分ける
- できれば次のJSON形式にしてください
{"pages":[{"text":"..."},{"text":"..."}]}
          `.trim();

          const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${encodeURIComponent(key)}`;

          const body = {
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ]
          };

          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });

          const data = await res.json().catch(() => null);

          if (!res.ok) {
            throw new Error(data?.error?.message || `HTTP ${res.status}`);
          }

          const parts = data?.candidates?.[0]?.content?.parts || [];
          const text = parts.map(p => p.text || "").join("\n").trim();

          if (!text) {
            throw new Error("モデルから本文が返ってきませんでした。");
          }

          const pages = splitStoryToPages(text, pageCount);

          if (!pages || !pages.length) {
            throw new Error("返答のページ分割に失敗しました。返答本文: \n" + text);
          }

          setStory(pages);
          setPageIndex(0);
          setStep("reader");
          setDebugInfo(`OK\nmodel=${MODEL_NAME}`);
        } catch (err) {
          setErrorMessage(err.message);
          setDebugInfo(String(err.stack || err.message || err));
          alert("エラー:\n" + err.message);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="max-w-md mx-auto min-h-screen p-6 font-sans">
          <header className="mb-8 text-center">
            <h1 className="text-3xl font-black text-rose-500">📖 AIえほんメーカー</h1>
            <p className="text-sm text-slate-500 mt-2">まずは最小構成で動作確認</p>
          </header>

          {step === "setup" ? (
            <div className="bg-white p-8 rounded-[2rem] shadow-xl border border-rose-100">
              <label className="block text-xs font-bold text-slate-400 mb-2">APIキー</label>
              <input
                type="password"
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                className="w-full p-4 bg-amber-50 rounded-2xl mb-6 border-2 border-transparent focus:border-amber-200 outline-none"
                placeholder="Google AI Studio の APIキー"
                autoComplete="off"
              />

              <label className="block text-xs font-bold text-slate-400 mb-2">しゅじんこう</label>
              <input
                value={mainChar}
                onChange={(e) => setMainChar(e.target.value)}
                className="w-full p-4 bg-rose-50 rounded-2xl mb-6 font-bold border-2 border-transparent focus:border-rose-200 outline-none text-lg"
              />

              <label className="block text-xs font-bold text-slate-400 mb-2">ぺーじすう</label>
              <select
                value={pageCount}
                onChange={(e) => setPageCount(Number(e.target.value))}
                className="w-full p-4 bg-sky-50 rounded-2xl mb-8 font-bold border-2 border-transparent focus:border-sky-200 outline-none text-lg"
              >
                <option value={4}>4ページ</option>
                <option value={8}>8ページ</option>
                <option value={12}>12ページ</option>
              </select>

              <button
                onClick={generateStory}
                disabled={loading}
                className="w-full bg-rose-500 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-rose-600 transition-all text-xl disabled:opacity-60"
              >
                {loading ? "つうしんちゅう..." : "✨ えほんをつくる！"}
              </button>

              <div className="mt-6 text-xs text-slate-500 leading-6">
                <p>・最初に利用可能モデル一覧を確認します</p>
                <p>・その後、1つのモデルだけで生成します</p>
                <p>・JSON強制はやめて、まず通ることを優先しています</p>
              </div>

              {errorMessage && (
                <div className="mt-6 bg-red-50 border border-red-200 rounded-2xl p-4">
                  <p className="text-sm font-bold text-red-600">エラー</p>
                  <p className="text-sm text-red-500 mt-2 whitespace-pre-wrap break-words">{errorMessage}</p>
                </div>
              )}

              {debugInfo && (
                <details className="mt-4 bg-slate-50 border border-slate-200 rounded-2xl p-4">
                  <summary className="cursor-pointer text-sm font-bold text-slate-600">詳細</summary>
                  <pre className="text-xs text-slate-600 mt-3 whitespace-pre-wrap break-words">{debugInfo}</pre>
                </details>
              )}
            </div>
          ) : (
            <div className="space-y-6">
              <div className="bg-white p-10 rounded-[3rem] shadow-2xl min-h-[320px] flex items-center justify-center border-8 border-white text-center relative">
                <div className="absolute top-5 right-6 text-xs font-bold text-rose-300">
                  {pageIndex + 1} / {story.length}
                </div>
                <p className="text-2xl font-black leading-relaxed">
                  {story[pageIndex]?.text || ""}
                </p>
              </div>

              <div className="flex justify-between items-center gap-4">
                <button
                  onClick={() => setPageIndex(Math.max(0, pageIndex - 1))}
                  disabled={pageIndex === 0}
                  className="w-16 h-16 bg-white rounded-2xl shadow-lg text-2xl border border-slate-100 disabled:opacity-40"
                >
                  ⬅️
                </button>

                <span className="font-bold text-slate-400">{pageIndex + 1} / {story.length}</span>

                <button
                  onClick={() => setPageIndex(Math.min(story.length - 1, pageIndex + 1))}
                  disabled={pageIndex === story.length - 1}
                  className="w-16 h-16 bg-rose-500 text-white rounded-2xl shadow-lg text-2xl disabled:opacity-40"
                >
                  ➡️
                </button>
              </div>

              <button
                onClick={() => setStep("setup")}
                className="w-full text-slate-400 text-sm mt-10"
              >
                もどる
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
