<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIえほんメーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#FFFBF5]">
    <div id="root"></div>

    <script type="text/babel">
        // アイコンのセットアップ
        const { BookOpen, Volume2, ChevronLeft, ChevronRight, Loader2, Key, Sparkles } = lucide;

        function App() {
            const [step, setStep] = React.useState("setup");
            const [apiKey, setApiKey] = React.useState("");
            const [mainChar, setMainChar] = React.useState("こうあちゃん");
            const [story, setStory] = React.useState([]);
            const [pageIndex, setPageIndex] = React.useState(0);
            const [loading, setLoading] = React.useState(false);

            // API実行関数
            const generateStory = async () => {
                if (!apiKey) return alert("APIキーを入力してください");
                setLoading(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${mainChar}が水族館で冒険する短い絵本を4ページ分、JSONで作って。形式: {"pages": [{"text": "ひらがな本文"}]}` }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await res.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    setStory(result.pages);
                    setStep("reader");
                } catch (e) {
                    alert("エラーが発生しました。キーを確認してください。");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6">
                    <header className="flex items-center gap-3 mb-8">
                        <div className="bg-rose-500 p-2 rounded-lg text-white"><BookOpen /></div>
                        <h1 className="text-xl font-bold text-slate-800">AIえほんメーカー</h1>
                    </header>

                    {step === "setup" ? (
                        <div className="bg-white p-6 rounded-3xl shadow-xl border border-rose-100">
                            <label className="block text-sm font-bold text-slate-400 mb-2">Gemini APIキー</label>
                            <input 
                                type="password" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)}
                                className="w-full p-3 bg-amber-50 rounded-xl mb-6 border border-amber-200"
                                placeholder="ここに入力（保存はされません）"
                            />
                            <label className="block text-sm font-bold text-slate-400 mb-2">しゅじんこう</label>
                            <input 
                                value={mainChar} 
                                onChange={(e) => setMainChar(e.target.value)}
                                className="w-full p-3 bg-rose-50 rounded-xl mb-8 font-bold"
                            />
                            <button 
                                onClick={generateStory}
                                className="w-full bg-rose-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-rose-600 transition-all flex items-center justify-center gap-2"
                            >
                                {loading ? <Loader2 className="animate-spin" /> : <Sparkles size={20} />}
                                えほんをつくる！
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <div className="bg-white p-8 rounded-3xl shadow-xl min-h-[200px] flex items-center justify-center text-center">
                                <p className="text-2xl font-black leading-relaxed">{story[pageIndex].text}</p>
                            </div>
                            <div className="flex justify-between items-center">
                                <button onClick={() => setPageIndex(Math.max(0, pageIndex - 1))} className="p-4 bg-white rounded-2xl shadow"><ChevronLeft /></button>
                                <span className="font-bold text-slate-400">{pageIndex + 1} / {story.length}</span>
                                <button onClick={() => setPageIndex(Math.min(story.length - 1, pageIndex + 1))} className="p-4 bg-rose-500 text-white rounded-2xl shadow"><ChevronRight /></button>
                            </div>
                            <button onClick={() => setStep("setup")} className="w-full text-slate-400 text-sm font-bold mt-10">設定にもどる</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
