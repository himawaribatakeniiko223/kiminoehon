<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIえほんメーカー</title>
  <style>
    :root{
      --bg:#fff8f2;
      --card:#ffffff;
      --main:#ef476f;
      --text:#24324a;
      --muted:#6f7d90;
      --line:#eadfd2;
      --sub:#f4f7fb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .wrap{
      max-width:1000px;
      margin:0 auto;
      padding:20px;
    }
    .title{
      text-align:center;
      margin:8px 0 20px;
    }
    .title h1{
      margin:0;
      color:var(--main);
      font-size:34px;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
    }
    .grid{
      display:grid;
      grid-template-columns:360px 1fr;
      gap:20px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 8px 28px rgba(0,0,0,.06);
      padding:18px;
    }
    label{
      display:block;
      margin:12px 0 6px;
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }
    input, select, textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      background:#fffdfa;
    }
    button{
      border:none;
      border-radius:16px;
      padding:14px 18px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
    .btn-main{
      width:100%;
      margin-top:16px;
      background:var(--main);
      color:#fff;
    }
    .btn-sub{
      background:var(--sub);
      color:var(--text);
    }
    .note, .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.7;
    }
    .status, .error, .debug{
      margin-top:12px;
      border-radius:14px;
      padding:12px 14px;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:13px;
    }
    .status{
      background:#eef7ff;
      color:#2f5f91;
    }
    .error{
      background:#fff1f3;
      color:#b4233d;
    }
    .debug{
      background:#f6f8fb;
      color:#556274;
    }
    .viewerTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }
    .pageCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius:28px;
      padding:18px;
      min-height:620px;
      display:grid;
      grid-template-rows:320px auto auto;
      gap:16px;
      box-shadow:0 8px 28px rgba(0,0,0,.06);
    }
    .imageBox{
      border-radius:22px;
      border:1px dashed #d6cfc3;
      background:linear-gradient(180deg,#fff9ec,#f3f2ff);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      position:relative;
      overflow:hidden;
    }
    .badge{
      position:absolute;
      top:12px;
      right:12px;
      background:rgba(255,255,255,.9);
      border:1px solid #eee;
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      color:#666;
    }
    .storyText{
      font-size:30px;
      line-height:1.8;
      font-weight:900;
      text-align:center;
      padding:4px 10px;
    }
    .promptBox{
      background:#f8fafc;
      border:1px solid #e7edf4;
      border-radius:16px;
      padding:12px;
      font-size:13px;
      line-height:1.7;
      color:#516173;
      white-space:pre-wrap;
    }
    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:16px;
    }
    .navCenter{
      color:var(--muted);
      font-weight:800;
    }
    .pill{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      background:#fff4f6;
      color:var(--main);
      font-size:12px;
      font-weight:800;
    }
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      .pageCard{min-height:auto}
      .storyText{font-size:24px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>📖 AIえほんメーカー</h1>
      <p>ユーザー設定 → AIストーリー → 挿絵プロンプト生成</p>
    </div>

    <div class="grid">
      <div class="card">
        <label>Gemini APIキー</label>
        <input id="apiKey" type="password" placeholder="Google AI Studio の APIキー" />

        <label>主人公</label>
        <input id="hero" type="text" value="こうあちゃん" />

        <label>登場人物</label>
        <input id="characters" type="text" value="ぺんぺん" placeholder="例: ぺんぺん、うさちゃん" />

        <label>場面</label>
        <input id="setting" type="text" value="はるの はなばたけ" placeholder="例: すいぞくかん、もり、うみべ" />

        <label>ページ数</label>
        <select id="pageCount">
          <option value="4" selected>4ページ</option>
          <option value="8">8ページ</option>
          <option value="12">12ページ</option>
        </select>

        <label>絵柄</label>
        <select id="artStyle">
          <option value="やさしい絵本風" selected>やさしい絵本風</option>
          <option value="やわらかいアニメ風">やわらかいアニメ風</option>
          <option value="水彩絵本風">水彩絵本風</option>
          <option value="クレヨン風">クレヨン風</option>
        </select>

        <label>お話の雰囲気</label>
        <select id="mood">
          <option value="やさしい">やさしい</option>
          <option value="たのしい">たのしい</option>
          <option value="わくわく">わくわく</option>
          <option value="あたたかい" selected>あたたかい</option>
        </select>

        <button id="generateBtn" class="btn-main">✨ えほんをつくる！</button>

        <div class="note" style="margin-top:12px;">
          ・本文生成と、ページごとの挿絵プロンプト生成に対応<br>
          ・今回は <b>responseMimeType を使わず</b>、JSON文字列を安全に抜き出します<br>
          ・画像生成モデルは別途接続できます
        </div>

        <div id="status" class="status" style="display:none;"></div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="debug" class="debug" style="display:none;"></div>
      </div>

      <div>
        <div class="viewerTop">
          <div class="small" id="modelInfo">使用モデル: 未実行</div>
          <div class="small" id="pageInfo">0 / 0</div>
        </div>

        <div class="pageCard">
          <div class="imageBox">
            <div>
              <div style="font-size:48px;">🖼️</div>
              <div style="font-weight:900; font-size:20px; margin-top:10px;">挿絵エリア</div>
              <div class="small" style="margin-top:8px;">
                今は本文に合わせた挿絵プロンプトを表示します。<br>
                画像モデルが使えるようになったらここに絵を出せます。
              </div>
            </div>
            <div class="badge">画像: 未接続</div>
          </div>

          <div class="storyText" id="storyText">ここに本文が表示されます</div>

          <div>
            <div class="small" style="margin-bottom:6px;">挿絵プロンプト</div>
            <div class="promptBox" id="promptBox">ここにページごとの挿絵プロンプトが表示されます</div>
          </div>
        </div>

        <div class="nav">
          <button id="prevBtn" class="btn-sub">⬅ 前へ</button>
          <div class="navCenter" id="navCenter">0 / 0</div>
          <button id="nextBtn" class="btn-main" style="width:auto; margin-top:0; padding:14px 20px;">次へ ➡</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODEL_CANDIDATES = [
      "gemini-2.5-flash",
      "gemini-2.5-flash-lite",
      "gemini-2.5-pro",
      "gemini-2.0-flash",
      "gemini-2.0-flash-001",
      "gemini-2.0-flash-lite",
      "gemini-2.0-flash-lite-001"
    ];

    let pages = [];
    let currentIndex = 0;
    let usedModel = "";

    const $ = (id) => document.getElementById(id);

    function setStatus(msg) {
      $("status").style.display = "block";
      $("status").textContent = msg;
    }

    function clearStatus() {
      $("status").style.display = "none";
      $("status").textContent = "";
    }

    function setError(msg) {
      $("error").style.display = "block";
      $("error").textContent = msg;
    }

    function clearError() {
      $("error").style.display = "none";
      $("error").textContent = "";
    }

    function setDebug(msg) {
      $("debug").style.display = "block";
      $("debug").textContent = msg;
    }

    function clearDebug() {
      $("debug").style.display = "none";
      $("debug").textContent = "";
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        throw new Error(data?.error?.message || `HTTP ${res.status}`);
      }
      return data;
    }

    async function getAvailableModels(apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1/models?key=${encodeURIComponent(apiKey)}`;
      const data = await fetchJson(url);
      return (data.models || []).map(m => m.name || "");
    }

    function extractTextFromGemini(data) {
      const parts = data?.candidates?.[0]?.content?.parts || [];
      return parts.map(p => p.text || "").join("\n").trim();
    }

    function tryParseBookJson(text) {
      if (!text) return null;

      // ```json ... ``` を優先
      const fenced =
        text.match(/```json\s*([\s\S]*?)\s*```/i) ||
        text.match(/```\s*([\s\S]*?)\s*```/i);

      const raw = fenced ? fenced[1] : text;

      // そのまま JSON として試す
      try {
        return JSON.parse(raw);
      } catch (e) {}

      // 最初の { から最後の } を拾う
      try {
        const first = raw.indexOf("{");
        const last = raw.lastIndexOf("}");
        if (first !== -1 && last !== -1 && last > first) {
          return JSON.parse(raw.slice(first, last + 1));
        }
      } catch (e) {}

      return null;
    }

    function splitFallbackPages(text, count) {
      const chunks = text
        .split(/\n{2,}/)
        .map(s => s.trim())
        .filter(Boolean);

      if (!chunks.length) {
        return Array.from({ length: count }, (_, i) => ({
          page: i + 1,
          text: text.trim() || "おはなしを よみこめませんでした。",
          imagePrompt: "やさしい絵本風、主人公、あたたかい雰囲気"
        }));
      }

      return chunks.slice(0, count).map((chunk, i) => ({
        page: i + 1,
        text: chunk,
        imagePrompt: "やさしい絵本風、本文に合う場面、あたたかい色、子ども向け"
      }));
    }

    function normalizePages(obj, rawText, count, settings) {
      if (obj && Array.isArray(obj.pages)) {
        const arr = obj.pages.map((p, i) => ({
          page: i + 1,
          text: String(p?.text || "").trim(),
          imagePrompt: String(p?.imagePrompt || "").trim()
        })).filter(p => p.text);

        if (arr.length) return arr.slice(0, count);
      }

      return splitFallbackPages(rawText, count).map((p, i) => ({
        page: i + 1,
        text: p.text,
        imagePrompt:
          p.imagePrompt ||
          `${settings.artStyle}、${settings.hero}、${settings.characters}、${settings.setting}、${settings.mood}、子ども向け絵本の1ページ、やさしい色合い`
      }));
    }

    async function generateBookData(apiKey, model, settings) {
      const prompt = `
あなたは子ども向け絵本の作家です。
次の設定で、${settings.pageCount}ページの絵本を作ってください。

設定:
- 主人公: ${settings.hero}
- 登場人物: ${settings.characters}
- 場面: ${settings.setting}
- 雰囲気: ${settings.mood}
- 絵柄: ${settings.artStyle}

条件:
- 対象年齢は3歳前後
- 文章はやさしい日本語
- なるべくひらがなを多く使う
- 1ページ 1〜2文
- 主人公は毎ページに出す
- こわくしない
- 最後はあたたかく終える
- 各ページごとに、その本文に合う挿絵プロンプトも作る
- 挿絵プロンプトには、構図、登場人物、表情、背景、色味、絵柄を入れる
- 返答はできるだけJSONだけにする

返答形式の例:
{
  "pages": [
    {
      "text": "こうあちゃんは はなばたけを あるきました。",
      "imagePrompt": "やさしい絵本風。こうあちゃんが春の花畑を歩いている。明るい表情。やわらかい光。あたたかい色合い。"
    }
  ]
}
      `.trim();

      const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

      const body = {
        contents: [
          {
            parts: [{ text: prompt }]
          }
        ]
      };

      const data = await fetchJson(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const text = extractTextFromGemini(data);
      if (!text) {
        throw new Error("モデルから本文が返ってきませんでした。");
      }

      const parsed = tryParseBookJson(text);
      const normalized = normalizePages(parsed, text, settings.pageCount, settings);

      if (!normalized || !normalized.length) {
        throw new Error("ページ解析に失敗しました。");
      }

      return { pages: normalized, rawText: text };
    }

    function updateViewer() {
      const total = pages.length;
      const page = pages[currentIndex];

      $("modelInfo").textContent = usedModel ? `使用モデル: ${usedModel}` : "使用モデル: 未実行";
      $("pageInfo").textContent = `${total ? currentIndex + 1 : 0} / ${total}`;
      $("navCenter").textContent = `${total ? currentIndex + 1 : 0} / ${total}`;

      if (!page) {
        $("storyText").textContent = "ここに本文が表示されます";
        $("promptBox").textContent = "ここにページごとの挿絵プロンプトが表示されます";
        return;
      }

      $("storyText").textContent = page.text;
      $("promptBox").textContent = page.imagePrompt || "挿絵プロンプトなし";
    }

    $("prevBtn").addEventListener("click", () => {
      if (!pages.length) return;
      currentIndex = Math.max(0, currentIndex - 1);
      updateViewer();
    });

    $("nextBtn").addEventListener("click", () => {
      if (!pages.length) return;
      currentIndex = Math.min(pages.length - 1, currentIndex + 1);
      updateViewer();
    });

    $("generateBtn").addEventListener("click", async () => {
      clearError();
      clearDebug();

      const apiKey = $("apiKey").value.trim();
      const settings = {
        hero: $("hero").value.trim() || "こうあちゃん",
        characters: $("characters").value.trim() || "ぺんぺん",
        setting: $("setting").value.trim() || "はるの はなばたけ",
        pageCount: Number($("pageCount").value),
        artStyle: $("artStyle").value,
        mood: $("mood").value
      };

      if (!apiKey) {
        setError("APIキーを入力してください。");
        return;
      }

      try {
        $("generateBtn").disabled = true;
        setStatus("モデル一覧を確認しています...");

        const availableModels = await getAvailableModels(apiKey);
        const usableModels = MODEL_CANDIDATES.filter(m => availableModels.includes(`models/${m}`));

        if (!usableModels.length) {
          throw new Error("使える本文モデルが見つかりませんでした。");
        }

        let errorLog = "";

        for (const model of usableModels) {
          try {
            setStatus(`えほんを生成しています... (${model})`);
            const result = await generateBookData(apiKey, model, settings);

            pages = result.pages;
            currentIndex = 0;
            usedModel = model;

            updateViewer();
            setStatus("本文と挿絵プロンプトの生成に成功しました。");
            setDebug(`使用モデル: ${model}\n\n最初のページ数: ${pages.length}`);
            return;
          } catch (e) {
            errorLog += `[${model}] ${e.message}\n`;
          }
        }

        throw new Error("すべての本文モデルで失敗しました。\n" + errorLog);
      } catch (e) {
        setError(e.message);
      } finally {
        $("generateBtn").disabled = false;
      }
    });

    updateViewer();
  </script>
</body>
</html>
