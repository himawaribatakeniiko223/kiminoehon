<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIえほんメーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FFFBF5]">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [step, setStep] = React.useState("setup");
            const [apiKey, setApiKey] = React.useState("");
            const [mainChar, setMainChar] = React.useState("こうあちゃん");
            const [story, setStory] = React.useState([]);
            const [pageIndex, setPageIndex] = React.useState(0);
            const [loading, setLoading] = React.useState(false);

            const generateStory = async () => {
                if (!apiKey) return alert("APIキーを入力してください");
                setLoading(true);
                
                // 2026年現在、最も安定している v1 エンドポイントを使用
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${mainChar}が主人公の、2歳児向けの優しい絵本を4ページ分作ってください。各ページ1〜2文のひらがなだけで。必ずこのJSON形式だけで返して。余計な説明は不要： {"pages": [{"text": "本文"}]}` }] }]
                        })
                    });

                    if (!res.ok) {
                        const errorData = await res.json();
                        throw new Error(errorData.error?.message || "通信エラー");
                    }

                    const data = await res.json();
                    let textResponse = data.candidates[0].content.parts[0].text;
                    
                    // AIがMarkdown形式（```json ... ```）で返してきた場合のクリーニング
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error("AIの返答からお話が見つかりませんでした。");
                    
                    const result = JSON.parse(jsonMatch[0]);
                    setStory(result.pages);
                    setStep("reader");
                    setPageIndex(0);
                } catch (e) {
                    console.error(e);
                    alert("エラー: " + e.message + "\n\n【ヒント】キーのコピーミス（前後の空白）がないか確認してください。");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-6 font-sans text-[#4A3F35]">
                    <header className="flex items-center gap-3 mb-8">
                        <div className="bg-rose-500 p-2 rounded-lg text-white font-bold text-xl shadow-lg shadow-rose-100">📖</div>
                        <h1 className="text-xl font
